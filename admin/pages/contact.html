<!--page
output: contact.html
title: Contact Tripreviewall
description: Get in touch with the Tripreviewall team.
path: /contact
ogType: website
css: pages
-->
<main id="main">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/">Home</a><span class="sep">/</span><span class="current">Contact</span>
    </nav>

    <div class="contact-layout">
      <div class="contact-info">
        <h1>Get in Touch</h1>
        <p>Questions about a tour, a correction to suggest, or press inquiries — we read every message.</p>
        <div class="contact-detail-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.36 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.34 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          <a href="tel:{{phoneHref}}">{{phone}}</a>
        </div>
        <div class="contact-detail-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 6-10 7L2 6"></path></svg>
          <a href="mailto:{{email}}">{{email}}</a>
        </div>
        <div class="contact-detail-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          <span>{{address}}</span>
        </div>
        <div class="contact-detail-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span>{{hours}}</span>
        </div>
      </div>

      <div class="contact-form-card">
        <div class="form-success" id="form-success" role="status" tabindex="-1">Thanks — your message has been received. We typically reply within one business day.</div>
        <div class="form-error" id="form-error" role="alert"></div>
        <form id="contact-form">
          <div class="hp-field" aria-hidden="true"><label>Company website (leave empty)<input type="text" name="companyWebsite" tabindex="-1" autocomplete="off"></label></div>
          <div class="form-group"><label for="cf-name">Full Name</label><input type="text" id="cf-name" required></div>
          <div class="form-group"><label for="cf-email">Email</label><input type="email" id="cf-email" required></div>
          <div class="form-group"><label for="cf-message">Message</label><textarea id="cf-message" required></textarea></div>
          <button type="submit" class="btn btn-primary btn-full">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</main>
<!--scripts-->
<script>
  document.getElementById("contact-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const form = this;
    const btn = form.querySelector("button[type=submit]");
    const originalText = btn.textContent;
    const errorBox = document.getElementById("form-error");
    errorBox.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
      const res = await fetch("/api/leads", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          source: "contact",
          name: document.getElementById("cf-name").value,
          email: document.getElementById("cf-email").value,
          message: document.getElementById("cf-message").value,
          companyWebsite: form.querySelector('[name="companyWebsite"]').value,
        }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || "Something went wrong.");
      form.style.display = "none";
      errorBox.style.display = "none";
      const ok = document.getElementById("form-success");
      ok.style.display = "block";
      ok.focus();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = originalText;
      errorBox.textContent = err.message || "Something went wrong — please try again or email us directly.";
      errorBox.style.display = "block";
    }
  });
</script>
<!--/scripts-->
